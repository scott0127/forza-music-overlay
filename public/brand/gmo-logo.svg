<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">GamingMusicOverlay</title>
  <desc id="desc">GMO layered beam logo with the GamingMusicOverlay wordmark.</desc>
  <defs>
